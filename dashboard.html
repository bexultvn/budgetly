<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgetly | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@500;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>

    <main class="main-area">
      <div class="top-bar">
        <div class="page-header">
          <button class="menu-toggle">☰</button>
          <div>
            <h1 class="page-title" id="welcomeTitle">Dashboard</h1>
            <p class="muted" id="welcomeCopy">Here's what's happening with your money. Let's manage it.</p>
          </div>
        </div>
      </div>

      <div class="overview-grid">
        <div class="card stat-card">
          <div>
            <span class="label">Total Budget</span>
            <div class="stat-value" id="totalBudget">$0</div>
          </div>
          <div class="stat-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 10c-1.4-1.4-3.7-2-7-2-3 0-5 .7-6 2v5h13v-3"></path>
              <path d="M7 10V8a2 2 0 0 1 2-2h5"></path>
              <path d="M15 18v1"></path>
              <path d="M9 18v1"></path>
              <path d="M9 14v1"></path>
              <path d="M15 14v1"></path>
              <path d="M19 14h1.5a1.5 1.5 0 1 0 0-3H19"></path>
            </svg>
          </div>
        </div>
        <div class="card stat-card">
          <div>
            <span class="label">Total Spend</span>
            <div class="stat-value" id="totalExpenses">$0</div>
          </div>
          <div class="stat-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="3" width="14" height="18" rx="3"></rect>
              <path d="M9 7h6"></path>
              <path d="M9 11h6"></path>
              <path d="M9 15h4"></path>
            </svg>
          </div>
        </div>
        <div class="card stat-card">
          <div>
            <span class="label">Remaining</span>
            <div class="stat-value" id="remainingStat">$0</div>
          </div>
          <div class="stat-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 7h14a2 2 0 0 1 2 2v7.5A2.5 2.5 0 0 1 18.5 19H7a2 2 0 0 1-2-2V7Z"></path>
              <path d="M5 11h16"></path>
              <path d="M7 15h2"></path>
            </svg>
          </div>
        </div>
      </div>

      <div class="activity-grid">
        <div class="card activity-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <h3>Recent Expenses</h3>
            <a class="button ghost" href="expenses.html">View all</a>
          </div>
          <table class="table" id="latestExpensesTable">
            <thead>
              <tr>
                <th>Budget</th>
                <th>Amount</th>
                <th>Note</th>
                <th>Date</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="latestExpensesBody"></tbody>
          </table>
          <div class="empty-state hidden" id="latestExpensesEmpty">No expenses</div>
        </div>
      </div>

      <div class="modal" id="confirmModal">
        <div class="modal-card">
          <div class="modal-header">
            <h3 id="confirmTitle">Are you sure?</h3>
            <button class="close-modal" data-close="#confirmModal">✕</button>
          </div>
          <p id="confirmMessage" class="muted" style="margin: 0 0 12px;">This action cannot be undone.</p>
          <div class="modal-actions">
            <button class="button ghost" type="button" id="confirmCancel">Cancel</button>
            <button class="button danger" type="button" id="confirmProceed">Delete</button>
          </div>
        </div>
      </div>

      <div class="modal" id="profileModal">
        <div class="modal-card profile-card">
          <div class="modal-header">
            <h3>Personal Info</h3>
            <button class="close-modal" data-close="#profileModal">✕</button>
          </div>
          <div class="profile-hero">
            <button class="avatar-button" type="button" id="profileAvatarButton" aria-label="Change avatar">
              <div class="avatar-preview large" id="profileAvatarPreview">AB</div>
            </button>
            <input type="file" id="profileAvatarInput" accept="image/*" hidden>
            <div class="profile-hero-meta">
              <div class="profile-hero-name" id="profileHeroName">User</div>
              <div class="profile-hero-email" id="profileHeroEmail">email</div>
            </div>
          </div>
          <div class="profile-fields">
            <div class="field">
              <label>Full Name</label>
              <input type="text" id="profileName">
            </div>
            <div class="field">
              <label>Email</label>
              <input type="email" id="profileEmail">
            </div>
          </div>
          <div id="profileMessage" class="message-bar hidden"></div>
          <div class="modal-actions profile-actions">
            <div class="profile-actions-buttons">
              <button class="button ghost" type="button" id="profileChangePasswordBtn">Change password</button>
              <button class="button" type="button" id="profileSaveBtn">Save changes</button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal" id="changePasswordModal">
        <div class="modal-card profile-card">
          <div class="modal-header">
            <h3>Change Password</h3>
            <button class="close-modal" data-close="#changePasswordModal">✕</button>
          </div>
          <div class="profile-fields">
            <div class="field">
              <label>Current Password</label>
              <input type="password" id="changePasswordCurrent" placeholder="Current password">
            </div>
            <div class="field">
              <label>New Password</label>
              <input type="password" id="changePasswordNew" placeholder="New password">
            </div>
            <div class="field">
              <label>Confirm New Password</label>
              <input type="password" id="changePasswordConfirm" placeholder="Confirm new password">
            </div>
          </div>
          <div id="changePasswordMessage" class="message-bar hidden"></div>
          <div class="modal-actions profile-actions">
            <div class="profile-actions-buttons">
              <button class="button ghost" type="button" id="changePasswordCancelBtn">Cancel</button>
              <button class="button" type="button" id="changePasswordSaveBtn">Save password</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
