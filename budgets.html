<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgetly | Budgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@500;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/budgets.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>

    <main class="main-area">
      <div class="top-bar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="menu-toggle">☰</button>
          <div>
            <h1 class="page-title">Budgets</h1>
          </div>
        </div>
      </div>

      <button class="button ghost icon-only hidden" id="backToBudgets" aria-label="Back" style="margin-bottom:10px;">←</button>

      <div class="grid budget-grid" id="budgetList"></div>

      <div id="budgetDetailShell" class="budget-detail-shell hidden">
        <div class="card budget-detail" id="budgetDetailCard">
          <div class="budget-detail-head">
            <div class="budget-detail-title">
              <div class="icon-circle primary" id="detailIcon">💳</div>
              <div>
                <h3 id="detailTitle" style="margin:0;">Selected Budget</h3>
                <p class="muted" id="detailMeta"></p>
              </div>
            </div>
            <div class="budget-detail-actions">
              <button class="button secondary" id="editBudgetBtn">Edit</button>
              <button class="button danger" id="deleteBudgetBtn">Delete</button>
            </div>
          </div>

          <div class="detail-stats">
            <div>
              <span class="muted small">Limit</span>
              <div class="stat-value" id="detailLimit">$0</div>
            </div>
            <div>
              <span class="muted small">Spent</span>
              <div class="stat-value" id="detailSpent">$0</div>
            </div>
            <div>
              <span class="muted small">Remaining</span>
              <div class="stat-value" id="detailRemaining">$0</div>
            </div>
          </div>

          <div class="progress" id="detailProgress"><span></span></div>

          <div class="detail-expenses">
            <div class="detail-expenses-head">
              <h4 style="margin:0;">Expenses</h4>
              <span class="muted" id="detailExpensesCount">0 items</span>
            </div>
            <div class="table-shell">
              <table class="table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="detailExpenseRows"></tbody>
              </table>
              <div class="empty-state hidden" id="detailEmptyState">No expenses yet. Add one on the right.</div>
            </div>
          </div>
        </div>

        <div class="card budget-form-card">
          <h3 style="margin-top:0;">Add Expense</h3>
          <form id="inlineExpenseForm">
            <div class="input-group">
              <label for="inlineExpenseName">Expense name</label>
              <input type="text" id="inlineExpenseName" required placeholder="e.g. Bedroom Decor">
            </div>
            <div class="input-group">
              <label for="inlineExpenseAmount">Amount</label>
              <input type="number" id="inlineExpenseAmount" min="0" step="1" required placeholder="e.g. 120">
            </div>
            <div class="input-group">
              <label for="inlineExpenseDate">Date</label>
              <input type="date" id="inlineExpenseDate" required>
            </div>
            <button type="submit" class="button">Add New Expense</button>
          </form>
        </div>
      </div>

      <div id="emptyBudgetsState" class="empty-state hidden">Create your first budget to get started.</div>

      <div class="modal" id="budgetModal">
        <div class="modal-card">
          <div class="modal-header">
            <h3>New Budget</h3>
            <button class="close-modal" data-close="#budgetModal">✕</button>
          </div>
          <form id="budgetForm">
            <div class="input-group">
              <label for="budgetTitle">Budget name</label>
              <input type="text" id="budgetTitle" required placeholder="Housing, Groceries, etc.">
            </div>
            <div class="input-group">
              <label for="budgetLimit">Monthly limit</label>
              <input type="number" id="budgetLimit" min="0" step="10" required placeholder="500">
            </div>
            <div class="input-group">
              <label for="budgetIcon">Icon</label>
              <div class="emoji-select">
                <button type="button" class="emoji-trigger" id="emojiTrigger" aria-expanded="false" aria-controls="emojiPicker">💳</button>
                <span class="emoji-hint muted">Choose an icon</span>
                <input type="hidden" id="budgetIcon" value="💳">
              </div>
              <div class="emoji-picker hidden" id="emojiPicker" role="listbox"></div>
            </div>
            <button type="submit" class="button" id="budgetSubmitBtn">Create Budget</button>
          </form>
        </div>
      </div>

      <div class="modal" id="expenseModal">
        <div class="modal-card">
          <div class="modal-header">
            <h3>Add Expense</h3>
            <button class="close-modal" data-close="#expenseModal">✕</button>
          </div>
          <form id="expenseForm">
            <div class="input-group">
              <label for="expenseBudget">Budget</label>
              <select id="expenseBudget" required></select>
            </div>
            <div class="input-group">
              <label for="expenseName">Expense name</label>
              <input type="text" id="expenseName" required placeholder="Groceries, Fuel...">
            </div>
            <div class="input-group">
              <label for="expenseAmount">Amount</label>
              <input type="number" id="expenseAmount" min="0" step="1" required>
            </div>
            <div class="input-group">
              <label for="expenseDate">Date</label>
              <input type="date" id="expenseDate" required>
            </div>
            <button type="submit" class="button">Add Expense</button>
          </form>
        </div>
      </div>

      <div class="modal" id="confirmModal">
        <div class="modal-card">
          <div class="modal-header">
            <h3 id="confirmTitle">Are you sure?</h3>
            <button class="close-modal" data-close="#confirmModal">✕</button>
          </div>
          <p id="confirmMessage" class="muted" style="margin: 0 0 12px;">This action cannot be undone.</p>
          <div class="modal-actions">
            <button class="button ghost" type="button" id="confirmCancel">Cancel</button>
            <button class="button danger" type="button" id="confirmProceed">Delete</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/budgets.js"></script>
</body>
</html>
