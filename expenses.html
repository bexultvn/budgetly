<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgetly | Expenses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@500;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/expenses.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>

    <main class="main-area">
      <div class="top-bar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="menu-toggle">☰</button>
          <div>
            <h1 class="page-title">Expenses</h1>
          </div>
        </div>
      </div>

      <section class="expense-toolbar">
        <div class="filter-group">
          <select id="filterBudget">
            <option value="all">All budgets</option>
          </select>
        </div>
        <button class="button" id="openExpenseModal">+</button>
      </setionc>

      <div class="card">
        <table class="table" id="expenseTable">
          <thead>
            <tr>
              <th>Expense</th>
              <th>Budget</th>
              <th>Amount</th>
              <th>Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="empty-state hidden" id="emptyExpenses">No expenses</div>
      </div>

      <div class="modal" id="expenseModal">
        <div class="modal-card">
          <div class="modal-header">
            <h3>Add Expense</h3>
            <button class="close-modal" data-close="#expenseModal">✕</button>
          </div>
          <form id="expenseForm">
            <div class="input-group">
              <label for="expenseBudget">Budget</label>
              <select id="expenseBudget" name="expenseBudget" required></select>
            </div>
            <div class="input-group">
              <label for="expenseName">Expense name</label>
              <input type="text" id="expenseName" name="expenseName" required placeholder="Subscription, Restaurant, ...">
            </div>
            <div class="input-group">
              <label for="expenseAmount">Amount</label>
              <input type="number" id="expenseAmount" name="expenseAmount" min="0" step="1" required>
            </div>
            <div class="input-group">
              <label for="expenseDate">Date</label>
              <input type="date" id="expenseDate" name="expenseDate" required>
            </div>
            <button type="submit" class="button">Save Expense</button>
          </form>
        </div>
      </div>

      <div class="modal" id="confirmModal">
        <div class="modal-card">
          <div class="modal-header">
            <h3 id="confirmTitle">Are you sure?</h3>
            <button class="close-modal" data-close="#confirmModal">✕</button>
          </div>
          <p id="confirmMessage" class="muted" style="margin: 0 0 12px;">This action cannot be undone.</p>
          <div class="modal-actions">
            <button class="button ghost" type="button" id="confirmCancel">Cancel</button>
            <button class="button danger" type="button" id="confirmProceed">Delete</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>
