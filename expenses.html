<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgetly | Expenses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@500;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/expenses.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>

    <main class="main-area">
      <div class="top-bar">
        <div style="display:flex; align-items:center; gap:10px;">
          <button class="menu-toggle">☰</button>
          <div>
            <h1 class="page-title">Expenses</h1>
          </div>
        </div>
      </div>

      <div class="expense-toolbar">
        <div class="filter-group">
          <select id="filterBudget">
            <option value="all">All budgets</option>
          </select>
        </div>
        <div class="filter-group">
          <input type="date" id="customStart" placeholder="From">
          <input type="date" id="customEnd" placeholder="To">
        </div>
        <button class="button" id="openExpenseModal">+</button>
      </div>

      <div class="card">
        <table class="table" id="expenseTable">
          <thead>
            <tr>
              <th>Budget</th>
              <th>Amount</th>
              <th>Note</th>
              <th>Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="empty-state hidden" id="emptyExpenses">No expenses</div>
      </div>

      <div class="modal" id="expenseModal">
        <div class="modal-card">
          <div class="modal-header">
            <h3>Add Expense</h3>
            <button class="close-modal" data-close="#expenseModal">✕</button>
          </div>
          <form id="expenseForm">
            <div class="input-group">
              <label for="expenseBudget">Budget</label>
              <select id="expenseBudget" required></select>
            </div>
            <div class="input-group">
              <label for="expenseName">Note</label>
              <input type="text" id="expenseName">
            </div>
            <div class="input-group">
              <label for="expenseAmount">Amount</label>
              <input type="number" id="expenseAmount" min="0" step="500" value="0" required>
            </div>
            <div class="input-group">
              <label for="expenseDate">Date</label>
              <input type="date" id="expenseDate" required>
            </div>
            <button type="submit" class="button">Add</button>
          </form>
        </div>
      </div>

      <div class="modal" id="confirmModal">
        <div class="modal-card">
          <div class="modal-header">
            <h3 id="confirmTitle">Are you sure?</h3>
            <button class="close-modal" data-close="#confirmModal">✕</button>
          </div>
          <p id="confirmMessage" class="muted" style="margin: 0 0 12px;">This action cannot be undone.</p>
          <div class="modal-actions">
            <button class="button ghost" type="button" id="confirmCancel">Cancel</button>
            <button class="button danger" type="button" id="confirmProceed">Delete</button>
          </div>
        </div>
      </div>

      <div class="modal" id="profileModal">
        <div class="modal-card profile-card">
          <div class="modal-header">
            <h3>Personal Info</h3>
            <button class="close-modal" data-close="#profileModal">✕</button>
          </div>
          <div class="profile-hero">
            <button class="avatar-button" type="button" id="profileAvatarButton" aria-label="Change avatar">
              <div class="avatar-preview large" id="profileAvatarPreview">AB</div>
            </button>
            <input type="file" id="profileAvatarInput" accept="image/*" hidden>
            <div class="profile-hero-meta">
              <div class="profile-hero-name" id="profileHeroName">User</div>
              <div class="profile-hero-email" id="profileHeroEmail">email</div>
            </div>
          </div>
          <div class="profile-fields">
            <div class="field">
              <label>Full Name</label>
              <input type="text" id="profileName">
            </div>
            <div class="field">
              <label>Email</label>
              <input type="email" id="profileEmail">
            </div>
          </div>
          <div id="profileMessage" class="message-bar hidden"></div>
          <div class="modal-actions profile-actions">
            <div class="profile-actions-buttons">
              <button class="button ghost" type="button" id="profileChangePasswordBtn">Change password</button>
              <button class="button" type="button" id="profileSaveBtn">Save changes</button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal" id="changePasswordModal">
        <div class="modal-card profile-card">
          <div class="modal-header">
            <h3>Change Password</h3>
            <button class="close-modal" data-close="#changePasswordModal">←</button>
          </div>
          <div class="profile-fields">
            <div class="field">
              <label>Current Password</label>
              <input type="password" id="changePasswordCurrent" placeholder="Current password">
            </div>
            <div class="field">
              <label>New Password</label>
              <input type="password" id="changePasswordNew" placeholder="New password">
            </div>
            <div class="field">
              <label>Confirm New Password</label>
              <input type="password" id="changePasswordConfirm" placeholder="Confirm new password">
            </div>
          </div>
          <div id="changePasswordMessage" class="message-bar hidden"></div>
          <div class="modal-actions profile-actions">
            <div class="profile-actions-buttons">
              <button class="button ghost" type="button" id="changePasswordCancelBtn">Cancel</button>
              <button class="button" type="button" id="changePasswordSaveBtn">Save password</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>
